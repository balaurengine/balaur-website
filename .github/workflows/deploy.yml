name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand to pull the engine's nightly into static/play (see below).
  workflow_dispatch:

env:
  # Which engine release static/play follows. A version tag (`v0.2.0`) pins
  # the site to that release; `nightly` tracks the engine's main branch.
  ENGINE_TAG: nightly

permissions:
  # write: a manual run commits an engine update (see below).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync reference docs from the engine repo
        run: ./scripts/sync-docs.sh
      # A manual run pulls the engine's nightly and lands it as a commit, so
      # the history says which build the site ran and a bad one is reverted
      # like any change. A push with the workflow's own token starts no run,
      # so the deploy is this run's.
      - name: Sync the web build from the engine release
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/sync-play.sh
      - name: Commit an engine update
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ -n "$(git status --porcelain static/play)" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/play
          git commit -m "engine $(cat static/play/VERSION)"
          git push
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: yarn install
        run: corepack enable && yarn --immutable
      - name: yarn build
        run: yarn build
      # Requires Pages to be enabled with Source: GitHub Actions in repo settings.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
