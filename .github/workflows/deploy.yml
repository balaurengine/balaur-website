name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand, or by the engine when it publishes a nightly, to pull that
  # nightly into static/play (see below).
  workflow_dispatch:
  repository_dispatch:
    types: [engine-nightly]

env:
  # Which engine release static/play follows. A version tag (`v0.2.0`) pins
  # the site to that release; `nightly` tracks the engine's main branch.
  ENGINE_TAG: nightly

permissions:
  # write: a manual run commits an engine update (see below).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync reference docs from the engine repo
        run: ./scripts/sync-docs.sh
      # A manual run, or the engine's nightly event, pulls that nightly and
      # lands it as a commit, so the history says which build the site ran and
      # a bad one is reverted like any change. A push with the workflow's own token starts no run,
      # so the deploy is this run's.
      - name: Sync the web build from the engine release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: ./scripts/sync-play.sh
      - name: Commit an engine update
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          [ -n "$(git status --porcelain static/play)" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/play
          git commit -m "engine $(cat static/play/VERSION)"
          git push
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: yarn install
        run: corepack enable && yarn --immutable
      # A post over 300 words of prose, a 35-word sentence, or an em dash in
      # prose is a red build: scripts/lint-prose.mjs holds the numbers.
      - name: yarn lint
        run: yarn lint
      # GITHUB_TOKEN is for scripts/gen-releases.mjs: a runner shares its IP
      # with every other job on it, and 60 unauthenticated calls an hour is
      # thin. SPONSORS_TOKEN is for scripts/gen-sponsors.mjs, which needs a
      # personal token with `read:org` that the runner's own token is not; with
      # the secret unset, that script keeps the committed list and the build is
      # the same. A pull request from a fork gets no secrets, by design.
      - name: yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: yarn build
      # Requires Pages to be enabled with Source: GitHub Actions in repo settings.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
